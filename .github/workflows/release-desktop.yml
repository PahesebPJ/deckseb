name: release-desktop

# Builds the Tauri shell + Node SEA sidecar installers on every platform.
# Manual runs upload the installers as workflow artifacts; once a manual run is green on all
# targets, add `release: { types: [published] }` below AND raise `contents` to `write` so
# tauri-action can attach the installers to each GitHub Release.
on:
  workflow_dispatch:

# Read-only until the release trigger exists: npm/cargo build scripts run with this token in reach.
permissions:
  contents: read

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # SEA cannot cross-compile, so each macOS architecture needs its own runner.
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The sidecar embeds this exact runtime; keep it on an LTS line.
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Check versions
        run: node scripts/check-versions.mjs

      # beforeBuildCommand (npm run build:sidecar) produces the SEA binary for this runner.
      - name: Build installers (manual run)
        if: github.event_name != 'release'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.target }}
        with:
          args: --target ${{ matrix.target }}

      - name: Build installers and attach to release
        if: github.event_name == 'release'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_TARGET_TRIPLE: ${{ matrix.target }}
        with:
          releaseId: ${{ github.event.release.id }}
          args: --target ${{ matrix.target }}

      # Runs after the build: tauri-build requires the sidecar binary to exist.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Smoke-test the sidecar binary
        shell: bash
        run: |
          bin="src-tauri/binaries/deckseb-server-${{ matrix.target }}"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          "$bin" --version
          node scripts/smoke-sidecar.mjs "$bin"

      - name: Upload installers
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: deckseb-desktop-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
          if-no-files-found: error
